name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check preinstalled Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          command -v cmake || true
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls -1 "$ANDROID_HOME/cmake" 2>/dev/null || true

      - name: Fetch RIFE ncnn Vulkan sources
        run: |
          rm -rf app/src/main/cpp/third_party/rife-ncnn-vulkan
          git clone --depth 1 --recurse-submodules             https://github.com/nihui/rife-ncnn-vulkan.git             app/src/main/cpp/third_party/rife-ncnn-vulkan

      - name: Fetch RIFE v4.6 neural model
        run: |
          set -e
          mkdir -p app/src/main/assets/models/rife-v4.6
          curl -L --fail --retry 4             "https://raw.githubusercontent.com/nihui/rife-ncnn-vulkan/master/models/rife-v4.6/flownet.param"             -o app/src/main/assets/models/rife-v4.6/flownet.param
          curl -L --fail --retry 4             "https://raw.githubusercontent.com/nihui/rife-ncnn-vulkan/master/models/rife-v4.6/flownet.bin"             -o app/src/main/assets/models/rife-v4.6/flownet.bin
          ls -lh app/src/main/assets/models/rife-v4.6

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameGen-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameGen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
